; ============================================================
;  softwear.pet — nRF52840 firmware (XIAO BLE Sense)
;
;  Target board: Seeed XIAO nRF52840 Sense
;  Chip:         Nordic nRF52840, ARM Cortex-M4 @ 64 MHz
;  Bluetooth:    5.0 via Adafruit Bluefruit BLE library
;  Onboard:      LSM6DS3TR-C IMU + PDM microphone (bonus over plain XIAO BLE)
;
;  Two build environments — same pattern as esp32c3/platformio.ini:
;
;  dev       — Full serial console over USB CDC. Use during development:
;                  pio run -e dev -t upload
;                  pio device monitor
;
;  battery   — USB CDC disabled to save ~10-15 mA. Use for battery / production:
;                  pio run -e battery -t upload
;              If auto-flash fails, double-tap RESET to enter UF2 bootloader,
;              or hold BOOT + press RESET + release BOOT.
; ============================================================

; USB CDC flags that the Arduino IDE auto-applies via build.flags.usb but which
; PlatformIO's community-fork platform doesn't inject. Required for Serial (CDC)
; to enumerate. VID/PID pulled from Adafruit boards.txt for XIAO nRF52840 Sense.
[common]
usb_flags =
    -DUSBCON
    -DUSE_TINYUSB
    -DNRF52840_XXAA
    -DUSB_VID=0x2886
    -DUSB_PID=0x8045
    -DUSB_MANUFACTURER=\"Seeed\"
    -DUSB_PRODUCT=\"XIAO_nRF52840_Sense\"

[env]
; Community-maintained fork of nordicnrf52 — includes XIAO BLE / Sense board defs
; and the Adafruit nRF52 core which is what we use for Bluefruit BLE.
platform      = https://github.com/maxgerhardt/platform-nordicnrf52.git
board         = xiaoblesense_adafruit
framework     = arduino
monitor_speed = 115200
; Upload: XIAO BLE Sense uses UF2 bootloader. We build firmware.hex, convert to
; UF2 manually via uf2conv.py, and drop it on the mounted XIAO-SENSE volume.
; See README.md for the upload command.
lib_deps      =
    olikraus/U8g2 @ ^2.35.30
; SPIFlash pulls in SdFat, whose `File` class collides with Adafruit_LittleFS's
; `File` (needed by Bluefruit for BLE bonding). We use InternalFS on the nRF52
; itself, so SPIFlash and its SdFat dep are unused — ignore them.
lib_ignore    =
    Adafruit SPIFlash
    SdFat - Adafruit Fork
    MIDI Library
    Adafruit NeoPixel

[env:dev]
build_flags =
    ${common.usb_flags}
    -DCFG_DEBUG=1
    -DENABLE_SERIAL_LOGS=1

[env:battery]
build_flags =
    ${common.usb_flags}
    -DBATTERY_MODE=1

; Hardware test — walks + mic. Uses hardware-tests/imu_pdm/ instead of src/.
; Build: pio run -e imu_test
[env:imu_test]
build_src_filter = -<*> +<../hardware-tests/imu_pdm/>
build_flags =
    ${common.usb_flags}
    -DENABLE_SERIAL_LOGS=1
