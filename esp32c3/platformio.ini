; ============================================================
;  softwear.pet ESP32-C3 firmware — two build environments
;
;  dev       — USB CDC enabled. Use while developing:
;                  pio run -e dev -t upload
;                  pio device monitor
;              Serial.println() output visible over USB.
;              ~10-15 mA higher current draw due to USB peripheral.
;
;  battery   — USB CDC disabled. Use for wearing / demos / battery:
;                  pio run -e battery -t upload
;              Serial.println() is silent.
;              ~10-15 mA lower current draw — ~50% longer battery life.
;              If auto-flash fails, put XIAO into DFU manually:
;                  hold BOOT → press RESET → release RESET → release BOOT
;                  then re-run the upload command.
; ============================================================

; --------- Shared config inherited by both environments ---------
[env]
platform      = espressif32
board         = seeed_xiao_esp32c3
framework     = arduino
monitor_speed = 115200
lib_deps      =
    olikraus/U8g2 @ ^2.35.30

; --------- Development build (USB CDC ON) ---------
[env:dev]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_SERIAL_LOGS=1

; --------- Battery / production build (USB CDC OFF) ---------
[env:battery]
build_flags =
    -DBATTERY_MODE=1
